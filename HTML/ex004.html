<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
</head>
<body>
    <h1>Trabalhando com links</h1>
    <p>Para utilizar e criar links, usamos a tag "a" (âncora)</p>

    <p>Para acessar o Google:
        <a href="https://google.com" target="_blank"><br>clique aqui.</a>
    </p>
    <p>Para acessar o G1:
        <a href="https://g1.globo.com/" target="_blank"><br>clique aqui.</a>
    </p>
    <p>Para acessar o GE:
        <a href="https://ge.globo.com/" target="_blank"><br>clique aqui.</a>
    </p>


    <h2>Links Favoritos</h2>
    <ul>
        <li><a href="https://facebook.com" target="_blank">Facebook</a></li>
        <li><a href="https://google.com" target="_blank">Google</a></li>
        <li><a href="https://chatgpt.com" target="_blank">Chatgpt</a></li>
    </ul>

</body>
</html>
