<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>

<body>
    <h1>Trabalhando com Listas</h1>

    <h2>Listas ordenadas</h2>

    <ol type="I" start="5">
        <li>Acordar</li>
        <li>Escovar os dentes</li>
        <li>Tomar café</li>
        <li>Passear com o cachorro</li>
        <li>Trocar de roupa</li>
        <li>Ir para o trabalho</li>
    </ol>

    <h2>Listas não ordenadas</h2>

    <ul type="disk">
        <li>Café</li>
        <li>Açucar</li>
        <li>Arroz</li>
        <li>Leite</li>
        <li>Macarrão</li>
        <li>Suco</li>
        <li>Queijo</li>
            
    </ul>
</body>

</html>
