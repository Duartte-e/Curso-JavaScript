<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        header{
            background-color: lightgray;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #logo{
            margin-left: 10px;
        }

        nav{
            background-color: black;
            padding: 10px;
        }

        nav > a{
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        section{
            background-color: lightpink;
            height: 300px;            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        section > div{
            width: 100px;
            height: 100px;
            background-color: blue;
            border: 1px solid black;
            margin: 10px
        }
    </style>
</head>
<body>
    <header>
        <div id="logo">
            MINHA LOGO
        </div>

        <nav>
            <a href="">Home</a>
            <a href="">Produtos</a>
            <a href="">Contato</a>
            <a href="">Sobre</a>
        </nav>
    </header>    

    <section>

        <div>
            ITEM A
        </div>
        
        <div>
            ITEM B
        </div>
        
        <div>
            ITEM C
        </div>
        

    </section>
</body>
</html>
