<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box 2</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }

        .container{
            margin-bottom: 20px;
            background-color: rgb(247, 247, 138);
            display: flex;
            justify-content: flex-start;
            /* justify-content: flex-end;
            justify-content: center; */
            height: 100px;
            align-items: start;
        }

        .item{
            background-color: lightblue;
            padding: 10px;
            border: 1px solid black;
        }

        #tipo1{
            justify-content: flex-end;
            align-items: center;
        }

        #tipo2{
            justify-content: center;
            align-items: end;
        }

        #tipo3{
            justify-content: space-around;
        }

        #tipo4{
            justify-content: space-between;
        }

        #tipo5{
            justify-content: space-evenly;
        }


    </style>
</head>
<body>
    <div class="container">
        <div class="item">Item A</div>
        <div class="item">Item B</div>
        <div class="item">Item C</div>
        <div class="item">Item D</div>
        <div class="item">Item E</div>
    </div>

    <div id="tipo1" class="container">
        <div class="item">Item A</div>
        <div class="item">Item B</div>
        <div class="item">Item C</div>
        <div class="item">Item D</div>
        <div class="item">Item E</div>
    </div>

    <div id="tipo2" class="container">
        <div class="item">Item A</div>
        <div class="item">Item B</div>
        <div class="item">Item C</div>
        <div class="item">Item D</div>
        <div class="item">Item E</div>
    </div>
    
    <div id="tipo3" class="container">
        <div class="item">Item A</div>
        <div class="item">Item B</div>
        <div class="item">Item C</div>
        <div class="item">Item D</div>
        <div class="item">Item E</div>
    </div>

    <div id="tipo4" class="container">
        <div class="item">Item A</div>
        <div class="item">Item B</div>
        <div class="item">Item C</div>
        <div class="item">Item D</div>
        <div class="item">Item E</div>
    </div>

    <div id="tipo5" class="container">
        <div class="item">Item A</div>
        <div class="item">Item B</div>
        <div class="item">Item C</div>
        <div class="item">Item D</div>
        <div class="item">Item E</div>
    </div>

    
</body>
</html>
