<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classe</title>

    <style>

        div {
            background-color: lightseagreen;
            width: 200px;
            height: 200px;
            text-align: center;
            margin: 10px;
        }

        div:hover {
            background-color: rgb(20, 221, 13);
            font-size: 30px;
        }
        
        #quadradovermelho:hover {
                background-color: rgb(202, 20, 20);
                font-size: 30px;
        }
        
        #quadradoazul:hover {
            background-color: rgb(18, 34, 175);
            font-size: 30px;
           
        }
   
    </style>

</head>

<body>
    <div>VERDE</div>
    <div id="quadradovermelho">VERMELHO</div>
    <div id="quadradoazul">AZUL</div>
</body>

</html>
